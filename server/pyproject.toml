[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp-mcp"
version = "0.6.1"
description = "MCP server for editing Hangul (HWP/HWPX) documents with fine-grained formatting tools"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pinned: the table-structure helpers in hwp_mcp.tables use python-hwpx
    # internals (hwpx.table_patch) that are not covered by its public API.
    "python-hwpx[preview]==6.6.0",
    "mcp==1.28.1",
]

[project.optional-dependencies]
# Semantic search (hwp_mcp.embed). "python -m hwp_mcp.embed prepare" installs these on demand.
embed = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]

[project.scripts]
hwp-mcp-server = "hwp_mcp.server:main"

[tool.setuptools]
packages = ["hwp_mcp"]
